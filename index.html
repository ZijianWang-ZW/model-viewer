<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLB Viewer (ThatOpen Components)</title>
  <style nonce="dev">
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    #toolbar {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 12px;
      background: rgba(30, 30, 30, 0.7);
      padding: 8px 10px;
      border-radius: 6px;
    }

    #container {
      height: 100%;
      width: 100%;
    }

    button {
      color: #fff;
      background: #6528D7;
      border: 0;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    #toolbar button[data-active="false"] {
      background: #4a4a4a;
      color: #ddd;
    }

    #toolbar button[data-active="true"] {
      background: #6528D7;
      color: #fff;
    }

    label {
      color: #fff;
      font: 12px sans-serif;
      margin-left: 6px;
    }

    #cull-config {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #cull-input-wrap {
      display: none;
      align-items: center;
      gap: 4px;
    }

    #cull-threshold {
      width: 50px;
    }

    #batch-input-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #batch-vertices {
      width: 60px;
    }

    #drag-config {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #drag-config input {
      width: 72px;
    }

    #zoom-config {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #zoom-config input {
      width: 72px;
    }

    #highlight-config {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #search-text {
      width: 80px;
      padding: 4px 6px;
      border: 1px solid #666;
      border-radius: 4px;
      background: rgba(50, 50, 50, 0.9);
      color: #fff;
      font: 12px sans-serif;
    }

    #search-text::placeholder {
      color: #aaa;
    }

    #search-text.hidden {
      display: none;
    }

    #clip-config {
      position: relative;
      display: inline-block;
    }

    #clip-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 6px;
      padding: 6px;
      min-width: 120px;
    }

    #clip-menu button {
      width: 100%;
      text-align: left;
      margin: 2px 0;
    }

    #info-panel {
      position: absolute;
      z-index: 10;
      top: 60px;
      left: 12px;
      min-width: 260px;
      max-width: 400px;
      background: rgba(30, 30, 30, 0.7);
      padding: 12px 14px;
      border-radius: 6px;
      color: #fff;
      font: 14px/1.45 sans-serif;
      display: none;
    }

    #info-panel h4 {
      margin: 0 0 8px 0;
      font: 600 15px/1.2 system-ui, sans-serif;
    }

    #info-panel .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 0;
    }

    #info-panel .key {
      opacity: 0.8;
    }

    #info-panel .val {
      text-align: right;
    }

    #stats-panel {
      position: absolute;
      z-index: 10;
      left: 12px;
      bottom: 12px;
      min-width: 210px;
      background: rgba(30, 30, 30, 0.7);
      padding: 10px 12px;
      border-radius: 6px;
      color: #fff;
      font: 14px/1.45 sans-serif;
    }

    #stats-panel .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 2px 0;
    }

    #batch-details {
      display: none;
      margin-top: 6px;
      max-height: 200px;
      overflow: auto;
    }

    #batch-details .bd-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 1px 0;
    }

    #edges-banner {
      position: absolute;
      z-index: 20;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.85);
      color: #fff;
      font: 14px/1.4 sans-serif;
      padding: 6px 10px;
      border-radius: 6px;
      display: none;
    }

    #pick-banner {
      display: none;
    }

    #toolbar #pick-banner {
      display: none;
      background: rgba(30, 30, 30, 0.85);
      color: #fff;
      font: 12px/1.3 sans-serif;
      padding: 4px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }

    #file {
      display: none;
    }

    /* Discipline Modal */
    #discipline-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
    }

    #discipline-modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(30, 30, 30, 0.95);
      padding: 24px;
      border-radius: 8px;
      min-width: 300px;
      color: #fff;
    }

    .modal-content h3 {
      margin: 0 0 16px 0;
      font: 600 16px/1.4 system-ui, sans-serif;
    }

    .discipline-options {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .discipline-option {
      padding: 12px 16px;
      background: rgba(50, 50, 50, 0.8);
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .discipline-option:hover {
      background: rgba(70, 70, 70, 0.9);
      border-color: #6528D7;
    }

    .discipline-option.selected {
      background: rgba(101, 40, 215, 0.3);
      border-color: #6528D7;
    }

    .discipline-icon {
      font-size: 20px;
      width: 24px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 16px;
    }

    /* Models Panel */
    #models-panel {
      position: absolute;
      z-index: 10;
      top: 12px;
      right: 12px;
      min-width: 200px;
      background: rgba(30, 30, 30, 0.9);
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      font: 14px/1.45 sans-serif;
      max-height: 400px;
      overflow-y: auto;
    }

    #models-panel h4 {
      margin: 0 0 12px 0;
      font: 600 15px/1.2 system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .model-item:hover {
      background: rgba(50, 50, 50, 0.5);
    }

    .model-item.all-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 8px;
      padding-bottom: 12px;
    }

    .visibility-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6528D7;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .visibility-icon.hidden {
      background: #4a4a4a;
      opacity: 0.6;
    }

    .discipline-icon-small {
      width: 20px;
      text-align: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .model-name {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-actions {
      display: flex;
      gap: 4px;
    }

    .model-action-btn {
      padding: 4px 8px;
      font-size: 11px;
      background: rgba(70, 70, 70, 0.8);
      border: none;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .model-action-btn:hover {
      background: rgba(100, 100, 100, 0.9);
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="edges-banner">Adding edges…</div>
    <div id="pick-banner"></div>

    <!-- Discipline Selection Modal -->
    <div id="discipline-modal">
      <div class="modal-content">
        <h3>Select Discipline</h3>
        <div class="discipline-options">
          <div class="discipline-option" data-discipline="Architecture">
            <span class="discipline-icon">🏛️</span>
            <span>Architecture</span>
          </div>
          <div class="discipline-option" data-discipline="Structure">
            <span class="discipline-icon">🏗️</span>
            <span>Structure</span>
          </div>
          <div class="discipline-option" data-discipline="Mechanical">
            <span class="discipline-icon">⚙️</span>
            <span>Mechanical</span>
          </div>
          <div class="discipline-option" data-discipline="Electrical">
            <span class="discipline-icon">⚡</span>
            <span>Electrical</span>
          </div>
          <div class="discipline-option" data-discipline="Plumbing">
            <span class="discipline-icon">🚰</span>
            <span>Plumbing</span>
          </div>
          <div class="discipline-option" data-discipline="Other">
            <span class="discipline-icon">📦</span>
            <span>Other</span>
          </div>
        </div>
        <div class="modal-actions">
          <button id="discipline-cancel">Cancel</button>
          <button id="discipline-confirm" disabled>Confirm</button>
        </div>
      </div>
    </div>

    <!-- Models Panel -->
    <div id="models-panel">
      <h4>
        <span>Models</span>
        <span id="model-count">0</span>
      </h4>
      <div id="models-list">
        <div class="model-item all-item" id="all-models-toggle">
          <div class="visibility-icon" title="Toggle all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <span class="model-name" style="font-weight: 600;">All</span>
        </div>
      </div>
    </div>

    <div id="toolbar">
      <button id="open">Open .glb</button>
      <button id="toggle-edges" data-active="false">Edges: Off</button>
      <button id="toggle-adaptive" data-active="false">Adaptive Res: Off</button>
      <button id="toggle-batching" data-active="true">Batching: On</button>
      <span id="batch-input-wrap">
        <label for="batch-vertices">Max. verts</label>
        <input id="batch-vertices" type="number" min="100" max="100000" value="20000" step="100" />
      </span>
      <span id="highlight-config">
        <button id="highlight-search" data-active="false">Highlight names</button>
        <input id="search-text" type="text" placeholder="Search text..." value="00" class="hidden" />
      </span>
      <span id="clip-config">
        <button id="clip-btn" data-active="false">Clip</button>
        <div id="clip-menu">
          <button id="clip-x">X plane</button>
          <button id="clip-y">Y plane</button>
          <button id="clip-z">Z plane</button>
        </div>
      </span>
      <span id="cull-config">
        <button id="toggle-cull" data-active="true">Cull: On</button>
        <span id="cull-input-wrap">
          <label for="cull-threshold">Cull(px)</label>
          <input id="cull-threshold" type="number" min="0" value="50" />
        </span>
      </span>
      <span id="drag-config">
        <label for="drag-smooth">Drag delay</label>
        <input id="drag-smooth" type="number" min="0" step="0.01" value="0.05" placeholder="Max: 0.5" />
      </span>
      <span id="zoom-config">
        <label for="zoom-speed">Zoom step</label>
        <input id="zoom-speed" type="number" min="0.1" step="0.1" value="0.5" placeholder="×1.0" />
      </span>
      <input id="file" type="file" accept=".glb" />
    </div>
    <div id="info-panel">
      <h4>Selection</h4>
      <div class="row"><span class="key">Name</span><span class="val" id="sel-name">-</span></div>
      <div class="row"><span class="key">Type</span><span class="val" id="sel-type">-</span></div>
      <div class="row"><span class="key">Verts</span><span class="val" id="sel-verts">-</span></div>
      <div class="row"><span class="key">Tris</span><span class="val" id="sel-tris">-</span></div>
    </div>
    <div id="stats-panel">
      <div class="row"><span class="key">Meshes</span><span class="val" id="stat-meshes">0</span></div>
      <div class="row"><span class="key">Batches</span><button class="val" id="stat-batches-btn"
          data-open="false">0</button></div>
      <div class="row"><span class="key">Unbatched</span><span class="val" id="stat-unbatched">0</span></div>
      <div class="row"><span class="key">Highlighted</span><span class="val" id="stat-highlighted">0</span></div>
      <div class="row"><span class="key">Materials</span><span class="val" id="stat-materials">0</span></div>
      <div class="row"><span class="key">Loaded in (s)</span><span class="val" id="stat-loadsec">N/A</span></div>
      <div class="row"><span class="key">Edges added in (s)</span><span class="val" id="stat-edgessec">N/A</span></div>
      <div id="batch-details"></div>
    </div>
    <div id="container"></div>
  </div>
  <script type="module" nonce="dev" src="/src/main.ts"></script>
</body>

</html>
